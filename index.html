<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171719" />
    <title>PICO-8 Player</title>
  </head>
  <body>
    <main>
      <header>
        <h1>PICO-8 <span>Player</span></h1>
        <button id="open-cart" type="button">
          <i data-lucide="folder-open" aria-hidden="true"></i>
          Open game
        </button>
        <input id="cart-file" type="file" accept=".p8.png" hidden />
      </header>
      <div id="player" aria-label="PICO-8 game">
        <div id="cartridge-label">
          <strong>PICASSETTE</strong>
          <span>PICO-8 CARTRIDGE</span>
        </div>
      </div>
      <footer>
        <span id="filename">No game selected</span>
        <span id="status" role="status" aria-live="polite"></span>
      </footer>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
